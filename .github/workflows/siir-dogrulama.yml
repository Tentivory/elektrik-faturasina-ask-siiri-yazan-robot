name: siir-dogrulama

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  kafiye:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fatura okut, siir al
        run: |
          python3 siirdoseme.py 12.34
          python3 siirdoseme.py 9999
